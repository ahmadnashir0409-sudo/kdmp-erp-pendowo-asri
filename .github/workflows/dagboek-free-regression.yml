name: DAGBOEK Free Regression Checks

on:
  push:
    branches:
      - feature/multi-kdmp-license-control-center
    paths:
      - "app.js"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/dagboek-free-regression.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.js"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/dagboek-free-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-tenant-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dagboek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dagboek_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check application JavaScript syntax
        run: node --check app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast==6.2

      - name: Parse SQL migrations
        run: python scripts/validate_sql_migrations.py

      - name: Run isolated tenant isolation smoke test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dagboek_test \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/tenant_isolation_smoke.sql
